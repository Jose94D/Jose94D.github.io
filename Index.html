<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi sitio en GitHub Pages</title>
    <style>
        /* Estilos básicos para que no se vea completamente plano */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
        }
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid #eaeaea;
        }
        h1 {
            color: #0366d6;
            margin-bottom: 10px;
        }
        main {
            padding: 20px 0;
        }
        footer {
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid #eaeaea;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>¡Hola, mundo! 🚀</h1>
        <p>Mi primera página web publicada con GitHub Pages.</p>
    </header>

    <main>
        <section>
            <h2>Sobre este sitio</h2>
            <p>Este es el archivo <code>index.html</code> de mi repositorio. A partir de aquí puedo empezar a añadir más secciones, imágenes, estilos y enlaces.</p>
        </section>
    </main>

    <footer>
        <p>Hecho con GitHub Pages.</p>
    </footer>

</body>
</html>
