{% import "_i18n.html" as i18n %}
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="nav-logo">{{ site.brand.first }} <span>{{ site.brand.last }}</span></a>
            <div class="nav-right">
                <ul class="nav-links">
                    {% for item in site.nav %}
                    <li><a href="#{{ item.id }}" class="nav-link" {{ i18n.attrs(item.label) }}>{{ item.label.es }}</a></li>
                    {% endfor %}
                </ul>
                <button id="lang-toggle" class="btn-lang" {{ i18n.aria(site.lang_toggle.aria) }}>
                    <i class="fas fa-globe" aria-hidden="true"></i> <span id="lang-text">{{ site.lang_toggle.label }}</span>
                </button>
            </div>
        </div>
    </nav>
